---
x-podman:
  default_net_behavior_compat: true

services:
  postgres:
    image: docker.io/library/postgres:15
    environment:
      POSTGRES_DB: trustify
      POSTGRES_USER: trustify
      POSTGRES_PASSWORD: trustify
    healthcheck:
      test: 
        - CMD-SHELL
        - pg_isready -U trustify
      interval: 5s
      timeout: 5s
      retries: 5

  trustify:
    image: ghcr.io/trustification/trustd:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        trustd db
        --db-host postgres
        --db-name trustify
        --db-user trustify
        --db-password trustify
        migrate &&
        exec trustd api
        --auth-disabled
        --db-host postgres
        --db-name trustify
        --db-user trustify
        --db-password trustify
        --http-server-bind-address 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: 
        - CMD-SHELL
        - bash -c 'echo > /dev/tcp/localhost/8080'
      interval: 5s
      timeout: 5s
      retries: 20

  pulp:
    build:
      context: ..
      dockerfile: tests/Containerfile.e2e
    environment:
      PULP_TRUSTIFY_URL: "http://trustify:8080"
      PULP_TRUSTIFY_API_VERSION: "v2"
      PULP_TRUSTIFY_ISSUER_URL: ""
      PULP_TRUSTIFY_CLIENT_SECRET: ""
      PULP_TRUSTIFY_GATE_UPLOADS: "${PULP_TRUSTIFY_GATE_UPLOADS:-False}"
      PULP_TRUSTIFY_SCAN_REMOVE_CONTENT: "${PULP_TRUSTIFY_SCAN_REMOVE_CONTENT:-False}"
      PULP_TRUSTIFY_YANK_VULNERABLE: "${PULP_TRUSTIFY_YANK_VULNERABLE:-False}"
      PULP_DEFAULT_ADMIN_PASSWORD: "password"
    depends_on:
      trustify:
        condition: service_healthy
    healthcheck:
      test: 
        - CMD-SHELL
        - curl -sf http://localhost:80/pulp/api/v3/status/ || exit 1
      interval: 5s
      timeout: 10s
      retries: 30

  runner:
    build:
      context: ..
      dockerfile: tests/Containerfile.e2e
    entrypoint: 
      - sleep
      - infinity
    environment:
      TRUSTIFY_URL: "http://trustify:8080"
      PULP_URL: "http://pulp:80"
      PULP_API_ROOT: "/pulp/"
      PULP_USERNAME: "admin"
      PULP_PASSWORD: "password"
      PULP_VERIFY_SSL: "false"
    depends_on:
      pulp:
        condition: service_healthy
