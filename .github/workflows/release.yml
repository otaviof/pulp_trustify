---
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
    - '**.md'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/otaviof/pulp_trustify

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - run: poe check

  release:
    needs: check
    runs-on: ubuntu-latest
    env:
      CONTAINER_RUNTIME: docker
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env

      - run: poe image-build

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push main branch image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ env.IMAGE }}:latest ${{ env.IMAGE }}:main
          docker push ${{ env.IMAGE }}:main

      - name: Push release images
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          poe image-tag
          VERSION=$(poe -q version)
          docker push ${{ env.IMAGE }}:${VERSION}
          docker push ${{ env.IMAGE }}:latest
