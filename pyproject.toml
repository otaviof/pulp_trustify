#
# Build System — PEP 517/518 backend configuration
#

[build-system]
# setuptools builds the sdist/wheel, wheel provides bdist_wheel
requires = ["setuptools >= 68.0", "wheel >= 0.41.0"]
build-backend = "setuptools.build_meta"

#
# Project Metadata — PEP 621 package definition
#

[project]
name = "pulp_trustify"
version = "0.1.0"
description = "Pulp plugin integrating Trustify CVE intelligence for vulnerability-gated artifact serving"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Otávio Fernandes" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# pulpcore is the Django-based plugin host framework
dependencies = [
    "pulpcore>=3.105.0,<3.115",
    "requests",
    "packaging",
    "semver>=3.0.0",
]

# dev extras: linting, testing, task runner
[project.optional-dependencies]
dev = ["ruff", "pytest", "poethepoet"]

# pulpcore discovers plugins via this entry point; the value resolves to the
# PulpTrustifyPluginAppConfig class path stored in pulp_trustify.__init__
[project.entry-points."pulpcore.plugin"]
pulp_trustify = "pulp_trustify:default_app_config"

#
# Setuptools — package discovery
#

[tool.setuptools]
# explicit package list (no auto-discovery) to control what ships in the wheel
packages = [
    "pulp_trustify",
    "pulp_trustify.app",
    "pulp_trustify.app.migrations",
    "pulp_trustify.app.tasks",
    "pulp_trustify.client",
    "pulp_trustify.purl",
]

#
# Ruff — linter and formatter
#

[tool.ruff]
line-length = 82
# skip generated/vendored code that shouldn't be linted
exclude = ["docs/**", "**/migrations/*.py"]

[tool.ruff.lint]
# E/F/W: pycodestyle, pyflakes, I: isort, TID: tidy-imports, T10: debugger calls
select = ["E", "F", "W", "I", "TID", "T10"]

[tool.ruff.lint.flake8-tidy-imports]
# force absolute imports everywhere
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# plugins must use the public API surface, not internal modules
"pulpcore.app".msg = "Use pulpcore.plugin instead of pulpcore.app"
# distutils is deprecated since Python 3.10
"distutils".msg = "distutils is deprecated, use setuptools"

#
# Pytest — test runner
#

[tool.pytest.ini_options]
testpaths = ["pulp_trustify", "tests"]
python_files = ["*_test.py", "test_*.py"]
addopts = ["--import-mode=importlib"]
markers = [
    "e2e: requires live Pulp + Trustify",
    "gate: upload gate (requires GATE_UPLOADS=true)",
    "guard: download guard",
    "npm: NPM registry support",
    "scan: scanner task",
    "status: plugin registration",
]

#
# Poe the Poet — task runner
#

[tool.poe]
envfile = ".env"

# container build and deployment variables.
[tool.poe.env.IMAGE_REPOSITORY]
default = "ghcr.io"
[tool.poe.env.IMAGE_NAMESPACE]
default = "otaviof"
[tool.poe.env.IMAGE_NAME]
default = "pulp_trustify"
[tool.poe.env.IMAGE_TAG]
default = "latest"
[tool.poe.env.IMAGE]
default = "${IMAGE_REPOSITORY}/${IMAGE_NAMESPACE}/${IMAGE_NAME}:${IMAGE_TAG}"
[tool.poe.env.CONTAINER_RUNTIME]
default = "podman"
[tool.poe.env.COMPOSE]
default = "podman compose"

[tool.poe.tasks]
# run ruff linter checks
lint = "ruff check ."
# auto-fix linter violations where possible
format-fix = "ruff check --fix ."
# check formatting without modifying files
format-check = "ruff format --check ."
# apply formatting
fmt = "ruff format ."

[tool.poe.tasks.test-unit]
help = "run unit tests"
shell = "pytest -m 'not e2e'; rc=$?; [ $rc -eq 5 ] && exit 0 || exit $rc"

[tool.poe.tasks.check]
help = "run all CI checks (lint, format, unit tests)"
sequence = ["lint", "format-check", "test-unit"]

[tool.poe.tasks.image-build]
help = "build the plugin container image"
cmd = "${CONTAINER_RUNTIME} build --tag ${IMAGE} --file Containerfile ."

[tool.poe.tasks.image-tag]
help = "tag the image with the project version"
shell = "VERSION=$(poe --quiet version) && ${CONTAINER_RUNTIME} tag ${IMAGE} ${IMAGE_REPOSITORY}/${IMAGE_NAMESPACE}/${IMAGE_NAME}:${VERSION}"

[tool.poe.tasks.image-push]
help = "push the plugin image to the registry"
cmd = "${CONTAINER_RUNTIME} push ${IMAGE} --tls-verify=false"

[tool.poe.tasks.deploy]
help = "provision secrets and patch the Pulp CR"
cmd = "deploy/deploy.py"

[tool.poe.tasks.e2e-up]
help = "start E2E infrastructure (PostgreSQL, Trustify and Pulp)"
cmd = "tests/workflow.py up"

[tool.poe.tasks.e2e-down]
cmd = "tests/workflow.py down"
help = "stop and remove E2E infrastructure"

[tool.poe.tasks.e2e-restart-pulp]
cmd = "tests/workflow.py restart-pulp"
help = "restart Pulp with GATE_UPLOADS=true for phase 2"

[tool.poe.tasks.test-e2e]
cmd = "tests/workflow.py test"
help = "run E2E tests (status, scan, guard)"

[tool.poe.tasks.test-e2e-gate]
cmd = "tests/workflow.py test-gate"
help = "run upload gate tests (requires GATE_UPLOADS=true)"

[tool.poe.tasks.test-e2e-direct]
help = "run E2E tests directly (no compose, for external environments)"
cmd = "pytest -m 'e2e and not gate and not guard' --verbose"

[tool.poe.tasks.e2e]
sequence = [
    "e2e-up",
    "test-e2e",
    "e2e-restart-pulp",
    "test-e2e-gate",
    "e2e-down",
]
help = "full two-phase E2E pipeline (requires Docker/Podman compose)"

[tool.poe.tasks.version]
help = "print the project version from pyproject.toml"
cmd = "python -c \"import tomllib, pathlib; print(tomllib.load(pathlib.Path('pyproject.toml').open('rb'))['project']['version'])\""
